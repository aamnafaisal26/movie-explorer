<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Explorer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1 class="logo">🎬 Movie Explorer</h1>
    <nav>
      <a href="index.html" class="active">Browse</a>
      <a href="watchlist.html">Watchlist <span id="watchlist-count" class="badge">0</span></a>
    </nav>
  </header>

  <main>
    <!-- Controls: search, genre filter, sort -->
    <section class="controls">
      <input type="search" id="search-input" placeholder="Search movies by title...">
      <div id="genre-buttons" class="genre-buttons">
        <!-- Genre buttons are created by filters.js -->
      </div>
      <select id="sort-select">
        <option value="rating-desc">Rating: high to low</option>
        <option value="rating-asc">Rating: low to high</option>
        <option value="year-desc">Year: newest first</option>
        <option value="year-asc">Year: oldest first</option>
        <option value="title-asc">Title: A to Z</option>
      </select>
    </section>

    <!-- Movie cards are inserted here by cards.js -->
    <section id="movie-grid" class="movie-grid"></section>
    <p id="empty-message" class="empty-message hidden">No movies match your search.</p>
  </main>

  <!-- Details view (modal), filled in by cards.js when a card is clicked -->
  <div id="details-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Movie Explorer &middot; ICT Project &middot; BCS-1G</p>
  </footer>

  <!-- Order matters: data first, then helpers, then main -->
  <script src="data/movies.js"></script>
  <script src="js/watchlist.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/filters.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
